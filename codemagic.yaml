workflows:
  ios-workflow:
    name: Publicar en TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Numismática Pliego"
    environment:
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: Crear certificados y perfiles en Apple
        script: |
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "eu.pliego.app" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key
      - name: Instalar certificados en el llavero
        script: |
          keychain add-certificates
      - name: Configurar firma en el proyecto Xcode
        script: |
          xcode-project use-profiles --project "src/Pliego.xcodeproj"
      - name: Instalar dependencias CocoaPods
        script: |
          cd src
          pod install
      - name: Compilar IPA
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "Pliego.xcworkspace" \
            --scheme "Pliego"
    artifacts:
      - build/ios/ipa/*.ipa
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
