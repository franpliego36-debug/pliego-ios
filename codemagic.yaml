workflows:
  ios-workflow:
    name: Publicar en TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Numismática Pliego"
    environment:
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Iniciar llavero del sistema
        script: keychain initialize

      - name: Generar clave privada para el certificado
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""

      - name: Obtener o crear certificados y perfiles en Apple
        script: |
          app-store-connect fetch-signing-files "eu.pliego.app" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key

      - name: Añadir certificados al llavero
        script: keychain add-certificates

      - name: Aplicar perfiles de firma al proyecto
        script: xcode-project use-profiles --project "src/Pliego.xcodeproj"

      - name: Instalar dependencias CocoaPods
        script: |
          cd src
          pod install

      - name: Compilar IPA
        script: |
          cd src
          xcode-project build-ipa --workspace "Pliego.xcworkspace" --scheme "Pliego" || {
            echo "--- MOTIVO EXACTO DEL ERROR ---"
            find /tmp/xcodebuild_logs -name "*.log" -exec tail -n 40 {} +
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
