workflows:
  ios-workflow:
    name: Publicar en TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Numismática Pliego"
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Crear o descargar certificados y perfiles en Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "eu.pliego.app" \
            --type IOS_APP_STORE \
            --create
      - name: Configurar firma en el proyecto
        script: |
          xcode-project use-profiles
      - name: Instalar dependencias CocoaPods
        script: |
          cd src
          pod install
      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --workspace "src/Pliego.xcworkspace" \
            --scheme "Pliego"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
